<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 384 384" width="512" height="512">
  <!-- Transparent-background Anagoge Hippo Icon for READMEs & Websites -->
  <defs>
    <clipPath id="above-water">
      <rect x="64" y="64" width="384" height="288"/>
    </clipPath>
  </defs>

  <!-- Subtle ascending aura behind star -->
  <circle cx="356" cy="134" r="42" fill="#FEF3C7" opacity="0.9"/>

  <!-- Warm-gold Anagoge North Star -->
  <path d="M356 94 L366 124 L396 134 L366 144 L356 174 L346 144 L316 134 L346 124 Z" fill="#F59E0B"/>
  <circle cx="310" cy="102" r="6" fill="#FBBF24"/>

  <!-- Hippo clipped cleanly at the top water line (y=352) -->
  <g clip-path="url(#above-water)">
    <g transform="translate(246, 274) rotate(-14) translate(-246, -274)">
      <ellipse cx="174" cy="172" rx="22" ry="26" fill="#3730A3" stroke="#1E1B4B" stroke-width="10"/>
      <ellipse cx="174" cy="174" rx="10" ry="13" fill="#A5B4FC"/>
      <ellipse cx="292" cy="172" rx="22" ry="26" fill="#3730A3" stroke="#1E1B4B" stroke-width="10"/>
      <ellipse cx="292" cy="174" rx="10" ry="13" fill="#A5B4FC"/>
      <path d="M146 276 C146 194, 182 162, 233 162 C284 162, 320 194, 320 276 Z"
            fill="#4F46E5" stroke="#1E1B4B" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="202" cy="222" r="14" fill="#1E1B4B"/>
      <circle cx="206" cy="217" r="5" fill="#FFFFFF"/>
      <circle cx="270" cy="222" r="14" fill="#1E1B4B"/>
      <circle cx="274" cy="217" r="5" fill="#FFFFFF"/>
      <rect x="132" y="242" width="212" height="120" rx="58"
