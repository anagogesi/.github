      <path d="M178 256 Q238 248 294 256" fill="none" stroke="#E0E7FF" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="200" cy="286" rx="9" ry="12" transform="rotate(-12 200 286)" fill="#312E81"/>
      <ellipse cx="276" cy="286" rx="9" ry="12" transform="rotate(12 276 286)" fill="#312E81"/>
      <path d="M214 326 Q238 340 262 326" fill="none" stroke="#1E1B4B" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 3 Ascending Stepped Geometric Water Ripples -->
  <rect x="96" y="352" width="320" height="16" rx="8" fill="#4F46E5"/>
  <rect x="134" y="384" width="244" height="16" rx="8" fill="#818CF8"/>
  <rect x="176" y="416" width="160" height="16" rx="8" fill="#C7D2FE"/>
</svg>
